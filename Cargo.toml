[workspace]
resolver = "2"
members = [
    "crates/burrow-cli",
    "crates/burrow-config",
    "crates/burrow-data",
    "crates/burrow-net",
    "crates/burrow-pkg",
    "crates/burrow-supervisor",
    "crates/burrow-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Burrow contributors"]
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
assert_cmd = "2.1.2"
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
crossterm = "0.28.1"
flate2 = "1.1.10"
futures-util = "0.3.31"
hex = "0.4.3"
http-body-util = "0.1.5"
httparse = "1.10.1"
humantime = "2.4.0"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
proptest = "1.9.0"
rand = "0.9.5"
ratatui = "0.29.0"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
schemars = "1.2.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = "0.7.19"
toml = "1.0.7"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2"] }

[profile.release]
lto = "thin"
strip = "symbols"
