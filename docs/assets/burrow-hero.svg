<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Burrow - native Windows local development stacks</title>
  <desc id="desc">An animated banner showing the Burrow wordmark beside a glowing tunnel of concentric rings, with the words One config. Native processes. Zero daemon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="55%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#101c38"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2b4d" stroke-width="1"/>
    </pattern>
    <style>
      .fade-up { animation: fadeUp 0.9s cubic-bezier(.2,.8,.2,1) both; }
      .d1 { animation-delay: .10s; }
      .d2 { animation-delay: .28s; }
      .d3 { animation-delay: .46s; }
      .d4 { animation-delay: .64s; }
      .d5 { animation-delay: .82s; }
      .d6 { animation-delay: 1.00s; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { opacity: .35; }
        50%      { opacity: .95; }
      }
      .drift { animation: drift 6s ease-in-out infinite; }
      @keyframes drift {
        0%, 100% { transform: translateX(0); }
        50%      { transform: translateX(-10px); }
      }
    </style>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)" opacity="0.35"/>

  <ellipse cx="1000" cy="210" rx="330" ry="240" fill="url(#glow)"/>

  <g class="drift" fill="none" stroke="#38bdf8">
    <ellipse cx="1000" cy="210" rx="286" ry="190" stroke-width="1.2" opacity="0.18"/>
    <ellipse cx="1000" cy="210" rx="238" ry="158" stroke-width="1.4" opacity="0.26"/>
    <ellipse cx="1000" cy="210" rx="190" ry="126" stroke-width="1.6" opacity="0.36"/>
    <ellipse cx="1000" cy="210" rx="142" ry="94" stroke-width="1.8" opacity="0.5"/>
    <ellipse cx="1000" cy="210" rx="94" ry="62" stroke-width="2" opacity="0.7"/>
    <ellipse cx="1000" cy="210" rx="46" ry="30" stroke-width="2.4" opacity="0.95"/>
  </g>

  <g fill="#7dd3fc">
    <circle cx="1270" cy="210" r="3" opacity="0.0">
      <animate attributeName="cx" values="1270;1000" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1270" cy="170" r="2" opacity="0.0">
      <animate attributeName="cx" values="1270;1000" dur="4.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="170;170" dur="4.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;0.1;0.8;1" dur="4.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1270" cy="250" r="2" opacity="0.0">
      <animate attributeName="cx" values="1270;1000" dur="5.1s" begin="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.8;.8;0" keyTimes="0;0.1;0.8;1" dur="5.1s" begin="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="1000" cy="210" r="18" fill="#38bdf8" opacity="0.55" filter="url(#soft)" class="pulse"/>
  <circle cx="1000" cy="210" r="6" fill="#e0f2fe"/>

  <g class="fade-up d1">
    <text x="80" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4.2" fill="#7dd3fc">LOCAL DEVELOPMENT, WITHOUT THE VM</text>
  </g>

  <g class="fade-up d2">
    <text x="76" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="4" fill="url(#word)">BURROW</text>
  </g>

  <g class="fade-up d3">
    <text x="82" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="500" fill="#cbd5e1">One config. Native processes. No Docker daemon.</text>
  </g>

  <g class="fade-up d4">
    <rect x="80" y="270" width="196" height="36" rx="18" fill="#0b1a30" stroke="#1e4b6e"/>
    <text x="178" y="293" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.1" fill="#7dd3fc">NO DOCKER DAEMON</text>
    <rect x="288" y="270" width="112" height="36" rx="18" fill="#0b1a30" stroke="#1e4b6e"/>
    <text x="344" y="293" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.1" fill="#7dd3fc">NO VM</text>
    <rect x="412" y="270" width="180" height="36" rx="18" fill="#0b1a30" stroke="#1e4b6e"/>
    <text x="502" y="293" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.1" fill="#7dd3fc">WINDOWS NATIVE</text>
  </g>

  <g class="fade-up d5">
    <text x="82" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#94a3b8">Windows 11 x64 verified  ·  Rust  ·  MIT OR Apache-2.0  ·  no telemetry</text>
  </g>

  <line x1="80" y1="380" x2="1200" y2="380" stroke="url(#line)" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0 1200;240 960;0 1200" dur="6s" repeatCount="indefinite"/>
  </line>
</svg>
