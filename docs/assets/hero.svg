<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Burrow: one command fans out into a native development stack</title>
  <desc id="hero-desc">Animation of 'burrow up' command expanding into supervised native services with health-gated startup, stable ports, loopback proxy, and snapshots.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="100%" stop-color="#f5f1ea"/>
    </linearGradient>
    <linearGradient id="panel-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefdfa"/>
      <stop offset="100%" stop-color="#fffdfa"/>
    </linearGradient>
    <linearGradient id="panel-hot-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="100%" stop-color="#fdf6f0"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fc6b33"/>
      <stop offset="100%" stop-color="#fc6b33"/>
    </linearGradient>
    <linearGradient id="flow-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fc6b33"/>
      <stop offset="100%" stop-color="#a67c5c"/>
    </linearGradient>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fc6b33"/>
    </marker>
    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#14110f" flood-opacity="0.06"/>
    </filter>
    <filter id="glow-accent" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .panel { fill: url(#panel-bg); stroke: #dbd7ce; stroke-width: 1.5; filter: url(#subtle-shadow); }
      .panel-hot { fill: url(#panel-hot-bg); stroke: #fc6b33; stroke-width: 1.5; filter: url(#subtle-shadow); }
      .panel-muted { fill: #f5f1ea; stroke: #e9e4d9; stroke-width: 1; }
      .wire { stroke: #a67c5c; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .label { font-family: "Red Hat Text", system-ui, sans-serif; fill: #58514c; font-size: 12px; }
      .name { font-family: "Red Hat Display", system-ui, sans-serif; fill: #14110f; font-size: 15px; font-weight: 600; }
      .tiny { font-family: "Red Hat Text", system-ui, sans-serif; fill: #58514c; font-size: 11px; }
      .note { font-family: "Red Hat Mono", monospace; fill: #58514c; font-size: 10.5px; }
      .title-text { font-family: "Red Hat Display", system-ui, sans-serif; fill: #14110f; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
      .subtitle-text { font-family: "Red Hat Text", system-ui, sans-serif; fill: #58514c; font-size: 13.5px; line-height: 1.5; }
      .accent-rule { fill: #fc6b33; }
      .green-dot { fill: #246e3a; }
      .contour { stroke: #a67c5c; stroke-width: 0.7; fill: none; opacity: 0.4; }
      .cmd-text { font-family: "Red Hat Mono", monospace; fill: #14110f; font-size: 16px; }
      .cmd-prompt { fill: #58514c; }
      .cmd-accent { fill: #fc6b33; }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cursor { animation: none; opacity: 1; }
      }
      .pulse {
        animation: pulse 2.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse { animation: none; opacity: 1; transform: scale(1); }
      }
      .reveal {
        opacity: 0;
        animation: reveal 0.7s ease-out forwards;
      }
      @keyframes reveal {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .reveal { animation: none; opacity: 1; }
      }
      .fan-in {
        opacity: 0;
        animation: fanIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes fanIn {
        from { opacity: 0; transform: translateX(-30px) scale(0.92); }
        to { opacity: 1; transform: translateX(0) scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .fan-in { animation: none; opacity: 1; }
      }
      .fan-in-delay-1 { animation-delay: 0.35s; }
      .fan-in-delay-2 { animation-delay: 0.55s; }
      .fan-in-delay-3 { animation-delay: 0.75s; }
      .fan-in-delay-4 { animation-delay: 0.95s; }
      .fan-in-delay-5 { animation-delay: 1.15s; }
      .flow-line {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: draw 1.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-line { animation: none; stroke-dashoffset: 0; }
      }
      .typed-line {
        opacity: 0;
        animation: typeIn 0.4s ease-out forwards;
      }
      @keyframes typeIn {
        from { opacity: 0; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .typed-line { animation: none; opacity: 1; }
      }
      .service-dot {
        animation: servicePulse 2s ease-in-out infinite;
      }
      @keyframes servicePulse {
        0%, 100% { opacity: 0.5; r: 4; }
        50% { opacity: 1; r: 5; }
      }
      @media (prefers-reduced-motion: reduce) {
        .service-dot { animation: none; opacity: 1; r: 4; }
      }
    </style>
  </defs>

  <!-- Paper background -->
  <rect x="0" y="0" width="1200" height="440" fill="url(#paper)"/>

  <!-- Top accent rule -->
  <rect x="0" y="0" width="1200" height="4" class="accent-rule"/>

  <!-- Title area -->
  <text x="48" y="52" class="title-text reveal" style="animation-delay: 0.05s;">One command. Native stack. Stable ports.</text>
  <text x="48" y="80" class="subtitle-text reveal" style="animation-delay: 0.15s;">burrow up fans out into supervised services with health-gated startup, a loopback proxy, and snapshots.</text>

  <!-- Terminal panel showing burrow up command -->
  <g class="panel-hot reveal" style="animation-delay: 0.25s;">
    <rect x="48" y="112" width="340" height="200" rx="10"/>
    <!-- Terminal header bar -->
    <rect x="48" y="112" width="340" height="36" rx="10" fill="#f5f1ea"/>
    <rect x="64" y="124" width="10" height="10" rx="50%" fill="#fc6b33" opacity="0.9"/>
    <rect x="82" y="124" width="10" height="10" rx="50%" fill="#a67c5c" opacity="0.9"/>
    <rect x="100" y="124" width="10" height="10" rx="50%" fill="#246e3a" opacity="0.9"/>
    <text x="240" y="134" class="note" style="font-size: 11px; fill: #58514c;">burrow — project: node-postgres</text>
  </g>

  <!-- Terminal content lines with typing animation -->
  <g class="reveal" style="animation-delay: 0.4s;">
    <text x="68" y="168" class="cmd-text">
      <tspan class="cmd-prompt">λ </tspan>
      <tspan class="cmd-accent">burrow up</tspan>
      <tspan class="cursor">█</tspan>
    </text>
  </g>
  <text x="68" y="196" class="note typed-line" style="animation-delay: 0.7s;">Loading burrow.toml…</text>
  <text x="68" y="218" class="note typed-line" style="animation-delay: 1.0s;">Validating configuration graph…</text>
  <text x="68" y="240" class="note typed-line" style="animation-delay: 1.3s;">Warming package cache (postgres@16.15)…</text>
  <text x="68" y="262" class="note typed-line" style="animation-delay: 1.6s;">Starting daemon on 127.0.0.1:49152…</text>
  <text x="68" y="284" class="note typed-line" style="animation-delay: 1.9s; fill: #246e3a;">✓ All services healthy — stack ready</text>

  <!-- Flow lines fanning out from terminal -->
  <g class="flow-line reveal" style="animation-delay: 2.1s;">
    <path d="M 388 168 C 440 140, 500 110, 535 110" stroke="url(#flow-gradient)" stroke-width="2.5" fill="none" marker-end="url(#arrow-right)"/>
  </g>
  <g class="flow-line reveal" style="animation-delay: 2.25s;">
    <path d="M 388 196 C 440 196, 500 196, 535 210" stroke="url(#flow-gradient)" stroke-width="2.5" fill="none" marker-end="url(#arrow-right)"/>
  </g>
  <g class="flow-line reveal" style="animation-delay: 2.4s;">
    <path d="M 388 224 C 440 260, 500 290, 535 310" stroke="url(#flow-gradient)" stroke-width="2.5" fill="none" marker-end="url(#arrow-right)"/>
  </g>
  <g class="flow-line reveal" style="animation-delay: 2.55s;">
    <path d="M 388 252 C 440 280, 500 320, 535 360" stroke="url(#flow-gradient)" stroke-width="2.5" fill="none" marker-end="url(#arrow-right)"/>
  </g>

  <!-- Small burst particles at flow origin -->
  <g class="reveal" style="animation-delay: 2.0s;">
    <circle cx="388" cy="168" r="3" fill="#fc6b33" opacity="0.8">
      <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite" begin="2.1s"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.5s" repeatCount="indefinite" begin="2.1s"/>
    </circle>
    <circle cx="388" cy="196" r="3" fill="#fc6b33" opacity="0.6">
      <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite" begin="2.25s"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1.5s" repeatCount="indefinite" begin="2.25s"/>
    </circle>
    <circle cx="388" cy="224" r="3" fill="#fc6b33" opacity="0.6">
      <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite" begin="2.4s"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1.5s" repeatCount="indefinite" begin="2.4s"/>
    </circle>
    <circle cx="388" cy="252" r="3" fill="#fc6b33" opacity="0.6">
      <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite" begin="2.55s"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1.5s" repeatCount="indefinite" begin="2.55s"/>
    </circle>
  </g>

  <!-- Daemon panel -->
  <g class="panel-hot fan-in fan-in-delay-1" style="animation-delay: 1.1s;">
    <rect x="520" y="100" width="210" height="110" rx="10"/>
    <rect x="520" y="100" width="210" height="32" rx="10" fill="#fdf6f0"/>
    <text x="535" y="120" class="note" style="font-size: 11px; fill: #fc6b33;">● CORE PROCESS</text>
  </g>
  <text x="535" y="150" class="name">daemon</text>
  <text x="535" y="170" class="tiny">state · ports · secrets</text>
  <text x="535" y="190" class="tiny">control IPC · health engine</text>
  <circle cx="695" cy="118" r="5" class="green-dot service-dot" style="animation-delay: 1.2s;"/>

  <!-- Supervisor panel -->
  <g class="panel-hot fan-in fan-in-delay-2" style="animation-delay: 1.2s;">
    <rect x="750" y="100" width="200" height="110" rx="10"/>
    <rect x="750" y="100" width="200" height="32" rx="10" fill="#fdf6f0"/>
    <text x="765" y="120" class="note" style="font-size: 11px; fill: #fc6b33;">● SUPERVISOR</text>
  </g>
  <text x="765" y="150" class="name">supervisor</text>
  <text x="765" y="170" class="tiny">Job Object per service</text>
  <text x="765" y="190" class="tiny">memory · CPU caps · cleanup</text>

  <!-- Native services panel -->
  <g class="panel-hot fan-in fan-in-delay-3" style="animation-delay: 1.3s;">
    <rect x="970" y="80" width="210" height="160" rx="10"/>
    <rect x="970" y="80" width="210" height="32" rx="10" fill="#fdf6f0"/>
    <text x="985" y="100" class="note" style="font-size: 11px; fill: #fc6b33;">● NATIVE SERVICES</text>
  </g>
  <text x="985" y="130" class="name">native services</text>
  <circle cx="992" cy="148" r="5" class="green-dot service-dot" style="animation-delay: 1.5s;"/>
  <text x="1008" y="152" class="tiny">postgres@16.15</text>
  <text x="1008" y="168" class="note" style="font-size: 10px; fill: #58514c;">5432 · initdb · seeded</text>
  <circle cx="992" cy="180" r="5" class="green-dot service-dot" style="animation-delay: 1.6s;"/>
  <text x="1008" y="184" class="tiny">api (node server.js)</text>
  <text x="1008" y="200" class="note" style="font-size: 10px; fill: #58514c;">port 45100 · HTTP ready</text>
  <circle cx="992" cy="212" r="5" class="green-dot service-dot" style="animation-delay: 1.7s;"/>
  <text x="1008" y="216" class="tiny">worker (if configured)</text>
  <text x="985" y="235" class="note">health-gated · auto-restart</text>

  <!-- Loopback proxy panel -->
  <g class="panel fan-in fan-in-delay-4" style="animation-delay: 1.4s;">
    <rect x="970" y="260" width="210" height="80" rx="10"/>
  </g>
  <text x="985" y="285" class="name">loopback proxy</text>
  <text x="985" y="307" class="tiny">*.localhost routing</text>
  <text x="985" y="327" class="tiny">WebSocket passthrough · 127.0.0.1</text>

  <!-- Package cache panel -->
  <g class="panel fan-in fan-in-delay-4" style="animation-delay: 1.5s;">
    <rect x="750" y="260" width="200" height="80" rx="10"/>
  </g>
  <text x="765" y="285" class="name">package cache</text>
  <text x="765" y="307" class="tiny">SHA-256 verified · resumable</text>
  <text x="765" y="327" class="tiny">hardened extraction · gc</text>

  <!-- Data / snapshots panel -->
  <g class="panel fan-in fan-in-delay-5" style="animation-delay: 1.6s;">
    <rect x="520" y="260" width="210" height="80" rx="10"/>
  </g>
  <text x="535" y="285" class="name">.burrow/data</text>
  <text x="535" y="307" class="tiny">snapshots · restore · reset</text>
  <text x="535" y="327" class="tiny">journaled rollback · atomic</text>

  <!-- Contour lines (subtle survey-map feel) -->
  <g class="contour reveal" style="animation-delay: 1.8s;">
    <path d="M 30 112 Q 600 90, 1170 112"/>
    <path d="M 30 212 Q 600 190, 1170 212" stroke-dasharray="4 6"/>
    <path d="M 30 312 Q 600 290, 1170 312"/>
    <path d="M 30 392 Q 600 370, 1170 392" stroke-dasharray="4 6"/>
  </g>

  <!-- Bottom accent rule and disclaimer -->
  <rect x="48" y="400" width="1104" height="2" fill="url(#accent-bar)" opacity="0.6"/>
  <text x="48" y="424" class="note">Services run as your Windows user. Job Objects provide cleanup and resource limits — not a security boundary.</text>
</svg>