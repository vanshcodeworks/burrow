<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 560" width="1200" height="560"
     role="img" aria-labelledby="burrow-title burrow-desc">
  <title id="burrow-title">Burrow — your local development stack, one command</title>
  <desc id="burrow-desc">A warm paper-toned illustration of the Burrow command starting a native Windows development stack. A terminal runs burrow up, a configuration flows through the Burrow daemon and supervisor, and the API and PostgreSQL services become healthy behind a localhost proxy.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f3eee4"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#292521"/>
      <stop offset="1" stop-color="#1d1a18"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e65e2e"/>
      <stop offset="1" stop-color="#f28a50"/>
    </linearGradient>
    <linearGradient id="soft-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1e8"/>
      <stop offset="1" stop-color="#ffe4d5"/>
    </linearGradient>
    <linearGradient id="soft-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf6e9"/>
      <stop offset="1" stop-color="#e3efdc"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#d9d0c2" stroke-width="0.7" opacity="0.42"/>
    </pattern>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d2c8b8" opacity="0.48"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#4e3829" flood-opacity="0.10"/>
    </filter>
    <filter id="small-shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4e3829" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#be7957"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#e56b3c"/>
    </marker>
    <style>
      .eyebrow { font: 700 12px 'Segoe UI', Arial, sans-serif; letter-spacing: 2.2px; fill: #9b654d; }
      .brand { font: 800 61px 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; fill: #211d1a; }
      .tagline { font: 700 29px 'Segoe UI', Arial, sans-serif; fill: #332a24; }
      .subline { font: 15px 'Segoe UI', Arial, sans-serif; fill: #766b60; }
      .mono { font: 13px Consolas, 'Courier New', monospace; }
      .mono-small { font: 11px Consolas, 'Courier New', monospace; }
      .card-title { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #2d2925; }
      .card-sub { font: 11px 'Segoe UI', Arial, sans-serif; fill: #82766b; }
      .pill-text { font: 700 10px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; }
      .wire { fill: none; stroke: #b99a82; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 5 7; }
      .wire-hot { fill: none; stroke: #e77a4a; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 6 8; }
      .node { fill: #fffdf9; stroke: #ded5c8; stroke-width: 1.4; }
      .node-hot { fill: #fffaf5; stroke: #e7a17f; stroke-width: 1.5; }
      .status { fill: #4f9b69; }
      .muted { fill: #a89b8d; }
      .flow { animation: dash 2.8s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-in-out infinite; }
      .reveal-a { animation: rise 0.7s ease-out both; }
      .reveal-b { animation: rise 0.8s 0.12s ease-out both; }
      .reveal-c { animation: rise 0.8s 0.24s ease-out both; }
      .reveal-d { animation: rise 0.8s 0.36s ease-out both; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%,100% { opacity: .65; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .pulse, .reveal-a, .reveal-b, .reveal-c, .reveal-d { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Paper surface -->
  <rect width="1200" height="560" rx="26" fill="url(#paper)"/>
  <rect width="1200" height="560" rx="26" fill="url(#grid)" opacity=".72"/>
  <rect x="0" y="0" width="1200" height="560" rx="26" fill="url(#dots)" opacity=".32"/>
  <path d="M0 25Q0 0 25 0H1175Q1200 0 1200 25V8H0Z" fill="#fff" opacity=".7"/>

  <!-- Decorative burrow-line motif -->
  <g opacity=".34" fill="none" stroke="#d8c8b7" stroke-width="2">
    <path d="M30 470C110 410 160 500 240 440S370 400 430 455"/>
    <path d="M30 486C110 426 160 516 240 456S370 416 430 471"/>
    <path d="M30 502C110 442 160 532 240 472S370 432 430 487"/>
  </g>

  <!-- Brand block -->
  <g class="reveal-a">
    <rect x="66" y="58" width="300" height="30" rx="15" fill="#f8e6da" stroke="#efd0bd"/>
    <circle cx="84" cy="73" r="4" fill="#e56b3c"/>
    <text x="98" y="77" class="eyebrow">NATIVE WINDOWS · LOCAL STACKS</text>
    <text x="64" y="164" class="brand">BURROW</text>
    <rect x="67" y="185" width="68" height="5" rx="2.5" fill="url(#orange)"/>
    <text x="66" y="230" class="tagline">Your local stack.</text>
    <text x="66" y="267" class="tagline">One command.</text>
    <text x="67" y="302" class="subline">Native services, stable ports, health checks.</text>
    <text x="67" y="324" class="subline">No Docker daemon or VM for native workloads.</text>
  </g>

  <!-- Terminal -->
  <g class="reveal-b" filter="url(#shadow)">
    <rect x="65" y="365" width="470" height="142" rx="15" fill="url(#terminal)"/>
    <path d="M65 380Q65 365 80 365H520Q535 365 535 380V395H65Z" fill="#35302b"/>
    <circle cx="86" cy="380" r="4" fill="#e17b61"/>
    <circle cx="102" cy="380" r="4" fill="#e3b96e"/>
    <circle cx="118" cy="380" r="4" fill="#7eaa7b"/>
    <text x="300" y="384" text-anchor="middle" class="mono-small" fill="#c8beb2">PowerShell · burrow</text>

    <text x="91" y="429" class="mono" fill="#d6c9b9">PS C:\dev\shop&gt;</text>
    <text x="246" y="429" class="mono" fill="#ff9a69">burrow up</text>
    <rect x="91" y="445" width="12" height="2" rx="1" fill="#f28a50">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <circle cx="98" cy="469" r="4" class="status pulse"/>
    <text x="111" y="473" class="mono-small" fill="#c8d7bf">api</text>
    <text x="154" y="473" class="mono-small" fill="#9bd2a5">healthy</text>
    <circle cx="250" cy="469" r="4" class="status pulse" style="animation-delay:.35s"/>
    <text x="263" y="473" class="mono-small" fill="#c8d7bf">db</text>
    <text x="292" y="473" class="mono-small" fill="#9bd2a5">healthy</text>
    <text x="407" y="473" class="mono-small" fill="#e9a17b">api.localhost</text>
    <text x="91" y="494" class="mono-small" fill="#82796f">health-gated startup · native processes</text>
  </g>

  <!-- Right side: flow connectors behind nodes -->
  <g>
    <path class="wire flow" d="M875 128V155" marker-end="url(#arrow)"/>
    <path class="wire flow" d="M875 236V263" marker-end="url(#arrow)"/>
    <path class="wire-hot flow" d="M875 337V358H735V382" marker-end="url(#arrow-orange)"/>
    <path class="wire-hot flow" d="M875 337V358H1010V382" marker-end="url(#arrow-orange)"/>
    <path class="wire flow" d="M735 454V478H875"/>
    <path class="wire flow" d="M1010 454V478H875"/>
    <path class="wire flow" d="M875 478V491" marker-end="url(#arrow)"/>
    <path class="wire" d="M735 417H675V300H780" opacity=".35"/>
  </g>

  <!-- Config node -->
  <g class="reveal-b" filter="url(#small-shadow)">
    <rect x="730" y="55" width="290" height="74" rx="14" class="node"/>
    <rect x="748" y="73" width="39" height="38" rx="9" fill="#f8e6da"/>
    <path d="M759 84h17M759 91h17M759 98h11" fill="none" stroke="#d56b43" stroke-width="2" stroke-linecap="round"/>
    <text x="803" y="86" class="card-title">burrow.toml</text>
    <text x="803" y="105" class="card-sub">One project · one declared stack</text>
    <rect x="953" y="75" width="48" height="20" rx="10" fill="#f4eee5"/>
    <text x="977" y="89" text-anchor="middle" class="pill-text" fill="#8a7664">CONFIG</text>
  </g>

  <!-- Daemon node -->
  <g class="reveal-c" filter="url(#small-shadow)">
    <rect x="730" y="158" width="290" height="78" rx="14" class="node"/>
    <rect x="748" y="177" width="39" height="39" rx="10" fill="#f1e9df"/>
    <circle cx="767.5" cy="196.5" r="9" fill="none" stroke="#806b58" stroke-width="2"/>
    <path d="M767 184v5M767 204v5M755 196h5M775 196h5" stroke="#806b58" stroke-width="2" stroke-linecap="round"/>
    <text x="803" y="190" class="card-title">Burrow daemon</text>
    <text x="803" y="209" class="card-sub">State · ports · package cache</text>
    <rect x="943" y="178" width="58" height="20" rx="10" fill="#f4eee5"/>
    <text x="972" y="192" text-anchor="middle" class="pill-text" fill="#8a7664">LOCAL</text>
  </g>

  <!-- Supervisor node -->
  <g class="reveal-c" filter="url(#small-shadow)">
    <rect x="730" y="266" width="290" height="72" rx="14" class="node-hot"/>
    <rect x="748" y="283" width="39" height="38" rx="9" fill="url(#soft-orange)"/>
    <path d="M758 292h19M758 301h19M758 310h12" stroke="#d56b43" stroke-width="2" stroke-linecap="round"/>
    <text x="803" y="295" class="card-title">Service supervisor</text>
    <text x="803" y="314" class="card-sub">Dependencies · health · restart policy</text>
  </g>

  <!-- API service -->
  <g class="reveal-d" filter="url(#small-shadow)">
    <rect x="622" y="383" width="226" height="72" rx="14" class="node"/>
    <rect x="638" y="400" width="38" height="38" rx="9" fill="#e8f0e3"/>
    <path d="M648 410h18M648 417h18M648 424h12" stroke="#668c63" stroke-width="2" stroke-linecap="round"/>
    <text x="688" y="412" class="card-title">API service</text>
    <text x="688" y="431" class="card-sub">Native Windows process</text>
    <circle cx="827" cy="402" r="4.5" class="status pulse"/>
  </g>

  <!-- Database service -->
  <g class="reveal-d" filter="url(#small-shadow)">
    <rect x="902" y="383" width="226" height="72" rx="14" class="node"/>
    <rect x="918" y="400" width="38" height="38" rx="9" fill="#f4e9df"/>
    <ellipse cx="937" cy="410" rx="10" ry="4" fill="none" stroke="#b67855" stroke-width="1.8"/>
    <path d="M927 410v15c0 5 20 5 20 0v-15M927 417c0 5 20 5 20 0" fill="none" stroke="#b67855" stroke-width="1.8"/>
    <text x="968" y="412" class="card-title">PostgreSQL</text>
    <text x="968" y="431" class="card-sub">Verified native package</text>
    <circle cx="1107" cy="402" r="4.5" class="status pulse" style="animation-delay:.35s"/>
  </g>

  <!-- Proxy node -->
  <g class="reveal-d" filter="url(#small-shadow)">
    <rect x="730" y="494" width="290" height="46" rx="13" fill="#2d2823"/>
    <path d="M751 517h19M765 511l6 6-6 6" stroke="#f5a078" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="786" y="513" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#fff8ef">LOCALHOST ROUTING</text>
    <text x="786" y="529" font-family="Consolas,'Courier New',monospace" font-size="10.5" fill="#efb28f">api.localhost</text>
    <circle cx="996" cy="517" r="4" fill="#7fc18d" class="pulse"/>
  </g>

  <!-- Small footer label -->
  <text x="1125" y="534" text-anchor="end" class="mono-small" fill="#9d8f81">FURROW / 01</text>
</svg>
