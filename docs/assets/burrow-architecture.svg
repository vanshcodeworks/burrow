<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Burrow architecture</title>
  <desc id="desc">A cross-section diagram showing burrow.toml and the CLI feeding a daemon, which drives a supervisor of Windows Job Objects, a package cache, logs, and a loopback proxy in front of native services.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="100%" stop-color="#f5f1ea"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefdfa"/>
      <stop offset="100%" stop-color="#fffdfa"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fc6b33"/>
      <stop offset="100%" stop-color="#fc6b33"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a67c5c"/>
    </marker>
    <style>
      .panel { fill: #fefdfa; stroke: #dbd7ce; stroke-width: 1.5; }
      .panel-hot { fill: #fffdfa; stroke: #fc6b33; stroke-width: 1.5; }
      .panel-muted { fill: #f5f1ea; stroke: #e9e4d9; stroke-width: 1; }
      .wire { stroke: #a67c5c; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .wire-solid { stroke: #a67c5c; stroke-width: 1.5; fill: none; }
      .label { font-family: "Red Hat Text", system-ui, sans-serif; fill: #58514c; font-size: 12px; }
      .name { font-family: "Red Hat Display", system-ui, sans-serif; fill: #14110f; font-size: 15px; font-weight: 600; }
      .tiny { font-family: "Red Hat Text", system-ui, sans-serif; fill: #58514c; font-size: 11px; }
      .note { font-family: "Red Hat Mono", monospace; fill: #58514c; font-size: 10.5px; }
      .title-text { font-family: "Red Hat Display", system-ui, sans-serif; fill: #14110f; font-size: 20px; font-weight: 700; }
      .subtitle-text { font-family: "Red Hat Text", system-ui, sans-serif; fill: #58514c; font-size: 13px; }
      .accent-rule { fill: #fc6b33; }
      .green-dot { fill: #246e3a; }
      .contour { stroke: #a67c5c; stroke-width: 0.8; fill: none; }
      .pulse {
        animation: pulse 3s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse { animation: none; opacity: 1; }
      }
      .reveal {
        opacity: 0;
        animation: reveal 0.8s ease-out forwards;
      }
      @keyframes reveal {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .reveal { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Paper background -->
  <rect x="0" y="0" width="1200" height="520" fill="url(#paper)"/>

  <!-- Accent bar at top -->
  <rect x="0" y="0" width="1200" height="4" class="accent-rule"/>

  <!-- Title -->
  <text x="40" y="48" class="title-text reveal" style="animation-delay: 0.1s;">One config. One supervisor. Native processes.</text>
  <text x="40" y="72" class="subtitle-text reveal" style="animation-delay: 0.2s;">Everything below runs under your Windows account. No VM and no container runtime are required for native services.</text>

  <!-- Config panel -->
  <g class="panel reveal" style="animation-delay: 0.3s;">
    <rect x="40" y="100" width="170" height="76" rx="8"/>
  </g>
  <text x="56" y="130" class="name reveal" style="animation-delay: 0.4s;">burrow.toml</text>
  <text x="56" y="152" class="tiny reveal" style="animation-delay: 0.4s;">services · ports · health</text>
  <text x="56" y="170" class="note reveal" style="animation-delay: 0.4s;">validated on load</text>

  <!-- CLI panel -->
  <g class="panel reveal" style="animation-delay: 0.35s;">
    <rect x="250" y="100" width="150" height="76" rx="8"/>
  </g>
  <text x="266" y="130" class="name reveal" style="animation-delay: 0.45s;">burrow CLI</text>
  <text x="266" y="152" class="tiny reveal" style="animation-delay: 0.45s;">up · status · logs</text>
  <text x="266" y="170" class="note reveal" style="animation-delay: 0.45s;">IPC client</text>

  <!-- Daemon panel (hot) -->
  <g class="panel-hot reveal" style="animation-delay: 0.4s;">
    <rect x="470" y="88" width="190" height="100" rx="8"/>
  </g>
  <text x="486" y="120" class="name reveal" style="animation-delay: 0.5s;">daemon</text>
  <text x="486" y="142" class="tiny reveal" style="animation-delay: 0.5s;">state · ports · secrets</text>
  <text x="486" y="162" class="tiny reveal" style="animation-delay: 0.5s;">control token · IPC</text>
  <circle cx="510" cy="108" r="4" class="green-dot pulse reveal" style="animation-delay: 1.2s;"/>

  <!-- Supervisor panel (hot) -->
  <g class="panel-hot reveal" style="animation-delay: 0.45s;">
    <rect x="720" y="88" width="180" height="100" rx="8"/>
  </g>
  <text x="736" y="120" class="name reveal" style="animation-delay: 0.55s;">supervisor</text>
  <text x="736" y="142" class="tiny reveal" style="animation-delay: 0.55s;">one Job Object</text>
  <text x="736" y="162" class="tiny reveal" style="animation-delay: 0.55s;">per service</text>

  <!-- Native services panel (large, hot) -->
  <g class="panel-hot reveal" style="animation-delay: 0.5s;">
    <rect x="960" y="66" width="200" height="150" rx="8"/>
  </g>
  <text x="976" y="96" class="name reveal" style="animation-delay: 0.6s;">native services</text>
  <circle cx="982" cy="116" r="4" class="green-dot pulse reveal" style="animation-delay: 1.3s;"/>
  <text x="996" y="120" class="tiny reveal" style="animation-delay: 0.6s;">postgres</text>
  <circle cx="982" cy="140" r="4" class="green-dot pulse reveal" style="animation-delay: 1.4s;"/>
  <text x="996" y="144" class="tiny reveal" style="animation-delay: 0.6s;">api</text>
  <circle cx="982" cy="164" r="4" class="green-dot pulse reveal" style="animation-delay: 1.5s;"/>
  <text x="996" y="168" class="tiny reveal" style="animation-delay: 0.6s;">worker</text>
  <text x="976" y="196" class="note reveal" style="animation-delay: 0.6s;">health-gated · restarted</text>

  <!-- Loopback proxy panel -->
  <g class="panel reveal" style="animation-delay: 0.55s;">
    <rect x="960" y="260" width="200" height="88" rx="8"/>
  </g>
  <text x="976" y="290" class="name reveal" style="animation-delay: 0.65s;">loopback proxy</text>
  <text x="976" y="312" class="tiny reveal" style="animation-delay: 0.65s;">*.localhost · WebSocket</text>
  <text x="976" y="330" class="tiny reveal" style="animation-delay: 0.65s;">127.0.0.1 by default</text>

  <!-- Package cache panel -->
  <g class="panel reveal" style="animation-delay: 0.6s;">
    <rect x="720" y="260" width="180" height="88" rx="8"/>
  </g>
  <text x="736" y="290" class="name reveal" style="animation-delay: 0.7s;">package cache</text>
  <text x="736" y="312" class="tiny reveal" style="animation-delay: 0.7s;">SHA-256 · resumable</text>
  <text x="736" y="330" class="tiny reveal" style="animation-delay: 0.7s;">hardened extraction</text>

  <!-- Logs panel -->
  <g class="panel reveal" style="animation-delay: 0.65s;">
    <rect x="470" y="312" width="190" height="88" rx="8"/>
  </g>
  <text x="486" y="342" class="name reveal" style="animation-delay: 0.75s;">logs</text>
  <text x="486" y="364" class="tiny reveal" style="animation-delay: 0.75s;">rotating files · ring</text>
  <text x="486" y="382" class="tiny reveal" style="animation-delay: 0.75s;">redacted bundles</text>

  <!-- Doctor panel -->
  <g class="panel reveal" style="animation-delay: 0.7s;">
    <rect x="250" y="312" width="150" height="88" rx="8"/>
  </g>
  <text x="266" y="342" class="name reveal" style="animation-delay: 0.8s;">doctor</text>
  <text x="266" y="364" class="tiny reveal" style="animation-delay: 0.8s;">read-only checks</text>
  <text x="266" y="382" class="tiny reveal" style="animation-delay: 0.8s;">remedies · JSON</text>

  <!-- Data panel -->
  <g class="panel reveal" style="animation-delay: 0.75s;">
    <rect x="40" y="312" width="170" height="88" rx="8"/>
  </g>
  <text x="56" y="342" class="name reveal" style="animation-delay: 0.85s;">.burrow/data</text>
  <text x="56" y="364" class="tiny reveal" style="animation-delay: 0.85s;">snapshots · restore</text>
  <text x="56" y="382" class="tiny reveal" style="animation-delay: 0.85s;">journaled rollback</text>

  <!-- Wires -->
  <g class="wire reveal" style="animation-delay: 0.9s;">
    <path d="M 210 138 H 242" marker-end="url(#arrow)"/>
    <path d="M 400 138 H 462" marker-end="url(#arrow)"/>
    <path d="M 660 138 H 712" marker-end="url(#arrow)"/>
    <path d="M 900 138 H 952" marker-end="url(#arrow)"/>
    <path d="M 1060 260 V 216" marker-end="url(#arrow)"/>
    <path d="M 565 188 V 304" marker-end="url(#arrow)"/>
    <path d="M 600 188 C 640 244, 690 274, 712 286" marker-end="url(#arrow)"/>
    <path d="M 325 176 V 304" marker-end="url(#arrow)"/>
    <path d="M 470 164 C 380 224, 240 254, 125 304" marker-end="url(#arrow)"/>
  </g>

  <!-- Wire labels -->
  <text x="218" y="128" class="label reveal" style="animation-delay: 1.0s;">load</text>
  <text x="414" y="128" class="label reveal" style="animation-delay: 1.0s;">IPC</text>
  <text x="668" y="128" class="label reveal" style="animation-delay: 1.0s;">spawn</text>
  <text x="908" y="128" class="label reveal" style="animation-delay: 1.0s;">run</text>
  <text x="1070" y="244" class="label reveal" style="animation-delay: 1.0s;">forward</text>
  <text x="576" y="252" class="label reveal" style="animation-delay: 1.0s;">write</text>
  <text x="646" y="242" class="label reveal" style="animation-delay: 1.0s;">verify</text>
  <text x="334" y="246" class="label reveal" style="animation-delay: 1.0s;">diagnose</text>
  <text x="250" y="256" class="label reveal" style="animation-delay: 1.0s;">snapshots</text>

  <!-- Contour lines (subtle survey-map feel) -->
  <g class="contour reveal" style="animation-delay: 1.1s;">
    <path d="M 30 100 Q 600 80, 1170 100"/>
    <path d="M 30 200 Q 600 180, 1170 200" stroke-dasharray="4 6"/>
    <path d="M 30 300 Q 600 280, 1170 300"/>
    <path d="M 30 400 Q 600 380, 1170 400" stroke-dasharray="4 6"/>
  </g>

  <!-- Bottom accent rule and disclaimer -->
  <rect x="40" y="460" width="1120" height="2" fill="url(#accent-bar)" opacity="0.6"/>
  <text x="40" y="490" class="note">Job Objects provide cleanup and resource limits, not a security boundary. Services share your Windows account and its filesystem and network access.</text>
</svg>