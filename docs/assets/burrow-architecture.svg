<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Burrow architecture</title>
  <desc id="desc">A diagram showing burrow.toml and the CLI feeding a daemon, which drives a supervisor of Windows Job Objects, a package cache, logs, and a loopback proxy in front of native services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#0d1830"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #0f1a2e; stroke: #24344f; stroke-width: 1.4; }
      .hot { stroke: #2b6f94; }
      .wire { stroke: #475569; stroke-width: 1.6; fill: none; stroke-dasharray: 6 6; }
      .label { font-family: Segoe UI, Arial, sans-serif; fill: #94a3b8; font-size: 12px; }
      .name { font-family: Segoe UI, Arial, sans-serif; fill: #e2e8f0; font-size: 15px; font-weight: 700; }
      .tiny { font-family: Segoe UI, Arial, sans-serif; fill: #64748b; font-size: 11.5px; }
      .spark { animation: spark 2.6s ease-in-out infinite; }
      @keyframes spark { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect x="2" y="2" width="1196" height="466" rx="20" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="42" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">One config. One supervisor. Native processes.</text>
  <text x="42" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#64748b">Everything below runs under your Windows account. No VM and no container runtime are required for native services.</text>

  <g class="box"><rect x="40" y="96" width="170" height="76" rx="10"/></g>
  <text x="56" y="126" class="name">burrow.toml</text>
  <text x="56" y="148" class="tiny">services · ports · health</text>

  <g class="box"><rect x="250" y="96" width="150" height="76" rx="10"/></g>
  <text x="266" y="126" class="name">burrow CLI</text>
  <text x="266" y="148" class="tiny">up · status · logs</text>

  <g class="box hot"><rect x="470" y="84" width="190" height="100" rx="10"/></g>
  <text x="486" y="116" class="name">daemon</text>
  <text x="486" y="138" class="tiny">state · ports · secrets</text>
  <text x="486" y="158" class="tiny">control token · IPC</text>

  <g class="box hot"><rect x="720" y="84" width="180" height="100" rx="10"/></g>
  <text x="736" y="116" class="name">supervisor</text>
  <text x="736" y="138" class="tiny">one Job Object</text>
  <text x="736" y="158" class="tiny">per service</text>

  <g class="box hot"><rect x="960" y="62" width="200" height="142" rx="10"/></g>
  <text x="976" y="92" class="name">native services</text>
  <circle cx="982" cy="112" r="4" fill="#34d399" class="spark"/>
  <text x="996" y="116" class="tiny">postgres</text>
  <circle cx="982" cy="136" r="4" fill="#34d399" class="spark"/>
  <text x="996" y="140" class="tiny">api</text>
  <circle cx="982" cy="160" r="4" fill="#38bdf8" class="spark"/>
  <text x="996" y="164" class="tiny">worker</text>
  <text x="976" y="188" class="tiny">health-gated · restarted</text>

  <g class="box"><rect x="960" y="248" width="200" height="84" rx="10"/></g>
  <text x="976" y="278" class="name">loopback proxy</text>
  <text x="976" y="300" class="tiny">*.localhost · WebSocket</text>
  <text x="976" y="318" class="tiny">127.0.0.1 by default</text>

  <g class="box"><rect x="720" y="248" width="180" height="84" rx="10"/></g>
  <text x="736" y="278" class="name">package cache</text>
  <text x="736" y="300" class="tiny">SHA-256 · resumable</text>
  <text x="736" y="318" class="tiny">hardened extraction</text>

  <g class="box"><rect x="470" y="300" width="190" height="84" rx="10"/></g>
  <text x="486" y="330" class="name">logs</text>
  <text x="486" y="352" class="tiny">rotating files · ring</text>
  <text x="486" y="370" class="tiny">redacted bundles</text>

  <g class="box"><rect x="250" y="300" width="150" height="84" rx="10"/></g>
  <text x="266" y="330" class="name">doctor</text>
  <text x="266" y="352" class="tiny">read-only checks</text>
  <text x="266" y="370" class="tiny">remedies · JSON</text>

  <g class="box"><rect x="40" y="300" width="170" height="84" rx="10"/></g>
  <text x="56" y="330" class="name">.burrow/data</text>
  <text x="56" y="352" class="tiny">snapshots · restore</text>
  <text x="56" y="370" class="tiny">journaled rollback</text>

  <g class="wire">
    <path d="M 210 134 H 242" marker-end="url(#arrow)"/>
    <path d="M 400 134 H 462" marker-end="url(#arrow)"/>
    <path d="M 660 134 H 712" marker-end="url(#arrow)"/>
    <path d="M 900 134 H 952" marker-end="url(#arrow)"/>
    <path d="M 1060 248 V 212" marker-end="url(#arrow)"/>
    <path d="M 565 184 V 292" marker-end="url(#arrow)"/>
    <path d="M 600 184 C 640 240, 690 270, 712 282" marker-end="url(#arrow)"/>
    <path d="M 325 172 V 292" marker-end="url(#arrow)"/>
    <path d="M 470 160 C 380 220, 240 250, 125 292" marker-end="url(#arrow)"/>
  </g>

  <text x="218" y="124" class="label">load</text>
  <text x="414" y="124" class="label">IPC</text>
  <text x="668" y="124" class="label">spawn</text>
  <text x="908" y="124" class="label">run</text>
  <text x="1070" y="232" class="label">forward</text>
  <text x="576" y="246" class="label">write</text>
  <text x="646" y="236" class="label">verify</text>
  <text x="334" y="240" class="label">diagnose</text>
  <text x="250" y="250" class="label">snapshots</text>

  <rect x="40" y="416" width="1120" height="2" fill="url(#accent)" opacity="0.7"/>
  <text x="42" y="444" class="tiny">Job Objects provide cleanup and resource limits, not a security boundary. Services share your Windows account and its filesystem and network access.</text>
</svg>
