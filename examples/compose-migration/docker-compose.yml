services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s

  cache:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    command: npm start
    environment:
      DATABASE_URL: postgres://postgres@db:5432/dev
      REDIS_URL: redis://cache:6379
    ports:
      - "3000:3000"
    depends_on:
      - db
      - cache
