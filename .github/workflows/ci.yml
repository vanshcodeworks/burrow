name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets -- --test-threads=1

      - name: Build release
        run: cargo build --workspace --release

      - name: Compatibility probe
        shell: pwsh
        run: .\scripts\compatibility.ps1 -Burrow .\target\release\burrow.exe

      - name: Upload burrow.exe
        uses: actions/upload-artifact@v4
        with:
          name: burrow-windows-x86_64
          path: target/release/burrow.exe
          if-no-files-found: error

  audit:
    name: audit
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Audit dependencies
        run: cargo audit

      - name: Check dependency policy
        run: cargo deny check --hide-inclusion-graph
