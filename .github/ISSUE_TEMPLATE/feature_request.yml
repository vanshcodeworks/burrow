name: Feature request
description: Suggest a change to Burrow
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Burrow is intentionally a local development tool, not a container
        runtime or production platform. Features that add a sandbox, cloud
        service, telemetry, or GUI are out of scope for v0.1.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you want, including commands and configuration.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing commands, workarounds, or other tools you tried.
  - type: textarea
    id: scope
    attributes:
      label: Scope and risks
      description: Does this affect the trust model, Windows-only support, package verification, or data safety?
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: This request is for local development on Windows, not a production or security feature.
          required: true
