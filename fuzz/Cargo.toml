[package]
name = "burrow-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
burrow-cli = { path = "../crates/burrow-cli" }
burrow-config = { path = "../crates/burrow-config" }
burrow-pkg = { path = "../crates/burrow-pkg" }
libfuzzer-sys = "0.4"

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_template"
path = "fuzz_targets/config_template.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registry_parse"
path = "fuzz_targets/registry_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extract_path"
path = "fuzz_targets/extract_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "state_parse"
path = "fuzz_targets/state_parse.rs"
test = false
doc = false
bench = false
